# Güvenlik ve sürüm güncellemeleri için otomatik pull request (OWASP A06).
# Büyük sürüm geçişleri (Next 16, Tailwind 4, TypeScript 7 gibi) kodu bozar;
# bunlar bilinçli olarak ayrı bir branch'te yapılır. Bot sadece küçük
# (minor/patch) güncellemeleri önerir.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
